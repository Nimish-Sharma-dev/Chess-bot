<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PyChess — Bitboard Engine</title>
<style>
  :root {
    --bg: #161a22; --board-light: #f0d9b5; --board-dark: #b58863;
    --panel: #21262d; --panel-border: #30363d; --edge: #30363d;
    --accent: #58a6ff; --accent-hover: #79b8ff;
    --text: #f0f6fc; --dim: #8b949e; --danger: #f85149; --danger-hover: #da3633;
    --success: #3fb950;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    overflow-x: hidden;
  }

  /* ---- Landing Page ---- */
  #landing {
    position: fixed; inset: 0; z-index: 100;
    background: radial-gradient(circle at 50% 30%, #1f2937 0%, #0d1117 70%);
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.5s ease, visibility 0.5s ease;
  }
  #landing.hidden {
    opacity: 0; visibility: hidden; pointer-events: none;
  }
  .landing-card {
    background: rgba(22, 27, 34, 0.85);
    border: 1px solid #30363d;
    backdrop-filter: blur(16px);
    border-radius: 20px;
    box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6), 0 0 1px 1px rgba(255, 255, 255, 0.05);
    text-align: center; max-width: 460px; width: 92%; padding: 40px 32px;
  }
  .landing-icon {
    font-size: 72px; line-height: 1;
    color: var(--accent);
    filter: drop-shadow(0 0 24px rgba(88, 166, 255, 0.5));
    margin-bottom: 12px;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .landing-title {
    font-size: 44px; font-weight: 800;
    color: #ffffff;
    letter-spacing: -0.5px;
    margin-bottom: 6px;
  }
  .landing-sub {
    font-size: 14px; color: var(--dim); letter-spacing: 1.2px;
    text-transform: uppercase; font-weight: 600; margin-bottom: 30px;
  }
  .landing-group { margin-bottom: 20px; text-align: left; }
  .landing-label {
    display: block; font-size: 12px; color: var(--dim);
    text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px; font-weight: 600;
  }
  .landing-options { display: flex; gap: 8px; }
  .landing-options button {
    flex: 1; padding: 10px 0; border-radius: 10px;
    background: #161b22; border: 1.5px solid #30363d; color: var(--text);
    font-size: 14px; font-weight: 500; cursor: pointer; transition: all .15s ease;
  }
  .landing-options button:hover { border-color: var(--accent); color: #fff; background: #21262d; }
  .landing-options button.active {
    background: var(--accent); border-color: var(--accent); color: #0d1117; font-weight: 700;
    box-shadow: 0 0 16px rgba(88, 166, 255, 0.4);
  }
  #btnPlay {
    margin-top: 14px; width: 100%; padding: 15px 0; border-radius: 12px;
    background: linear-gradient(135deg, #58a6ff, #1f6feb);
    border: none; color: #ffffff;
    font-size: 18px; font-weight: 700; cursor: pointer;
    box-shadow: 0 4px 20px rgba(31, 111, 235, 0.4);
    transition: transform .15s, box-shadow .15s;
  }
  #btnPlay:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 28px rgba(31, 111, 235, 0.6);
  }
  .landing-features {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 24px;
  }
  .landing-badge {
    font-size: 11px; padding: 4px 10px; border-radius: 20px;
    background: rgba(110, 118, 129, 0.15); color: var(--dim);
    border: 1px solid rgba(110, 118, 129, 0.2);
  }

  /* ---- App Container ---- */
  .app {
    display: none; gap: 24px; padding: 24px;
    max-width: 1200px; width: 100%; justify-content: center;
  }
  .app.visible { display: flex; }

  /* ---- Side Panel ---- */
  .panel {
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 16px;
    width: 320px; padding: 20px; display: flex; flex-direction: column; gap: 12px;
    box-shadow: 0 12px 36px rgba(0, 0, 0, 0.4);
  }
  .panel-header {
    display: flex; justify-content: space-between; align-items: center;
  }
  h1 { font-size: 24px; font-weight: 700; color: var(--accent); }
  .row { display: flex; gap: 8px; }

  button {
    background: #2b323c; color: var(--text); border: 1px solid var(--edge);
    border-radius: 8px; padding: 8px 12px; cursor: pointer; font-size: 13px; font-weight: 500;
    transition: all .15s ease;
  }
  button:hover { background: #38424f; border-color: #444d56; }
  button.primary {
    background: var(--accent); color: #0d1117; font-weight: 600; border-color: var(--accent);
  }
  button.primary:hover { background: var(--accent-hover); }
  button.danger {
    background: #361f22; color: #ff7b72; border-color: rgba(248, 81, 73, 0.4);
  }
  button.danger:hover { background: var(--danger); color: #fff; }

  select {
    background: #161b22; color: var(--text); border: 1px solid var(--edge);
    border-radius: 8px; padding: 8px 10px; font-size: 13px; font-weight: 500;
  }

  .controls {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  }
  .controls select, .controls button {
    width: 100%; height: 38px; padding: 0 10px; font-size: 13px;
  }
  .controls .span2 { grid-column: 1 / -1; }

  .status {
    color: var(--dim); font-size: 13px; min-height: 20px;
    display: flex; align-items: center; gap: 6px;
  }
  .status b { color: var(--text); font-weight: 600; }

  /* ---- Board & Eval ---- */
  .boardwrap { position: relative; }
  #board {
    width: 640px; height: 640px; display: grid;
    grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr);
    border-radius: 10px; overflow: hidden;
    box-shadow: 0 0 0 10px #2b323c, 0 20px 48px rgba(0, 0, 0, 0.6);
    user-select: none; touch-action: none;
  }
  .sq { position: relative; width: 100%; height: 100%; cursor: pointer; }
  .sq.light { background: var(--board-light); }
  .sq.dark  { background: var(--board-dark); }
  .sq .pc {
    position: absolute; inset: 4%;
    background-size: contain; background-repeat: no-repeat; background-position: center;
    cursor: grab; pointer-events: none;
  }
  .sq.last::after {
    content: ""; position: absolute; inset: 0; background: rgba(246, 236, 110, 0.45);
  }
  .sq.check::after {
    content: ""; position: absolute; inset: 0; background: rgba(214, 59, 59, 0.6);
  }
  .sq.sel { outline: 3.5px solid #2ea043; outline-offset: -3.5px; }
  .dot {
    position: absolute; left: 50%; top: 50%; width: 24%; height: 24%;
    transform: translate(-50%, -50%); border-radius: 50%;
    background: rgba(20, 20, 20, 0.35); pointer-events: none;
  }
  .ring {
    position: absolute; inset: 6%; border-radius: 50%;
    border: 6px solid rgba(20, 20, 20, 0.35); pointer-events: none;
  }
  .sq:hover .pc { filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.5)); }
  .sq.drag-src .pc { visibility: hidden; }
  .drag-ghost {
    position: fixed; z-index: 50; pointer-events: none;
    background-size: contain; background-repeat: no-repeat; background-position: center;
    filter: drop-shadow(0 10px 16px rgba(0, 0, 0, 0.6));
  }
  body.dragging, body.dragging * { cursor: grabbing !important; }

  .bar { display: flex; gap: 10px; align-items: stretch; flex: 1; min-height: 0; height: 260px; }
  #evalbar {
    width: 20px; border-radius: 6px; background: #161b22; position: relative; overflow: hidden;
    border: 1px solid var(--edge);
  }
  #evalfill { position: absolute; bottom: 0; left: 0; right: 0; background: #f0f6fc; transition: height .4s ease; }
  #evalmid { position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: var(--accent); }
  #moves {
    flex: 1; background: #161b22; border: 1px solid var(--edge); border-radius: 8px;
    padding: 10px 12px; overflow-y: auto; font-size: 13px; line-height: 1.7; font-family: monospace;
  }
  #moves .num { color: var(--dim); display: inline-block; width: 32px; }

  .trays { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tray {
    display: flex; flex-wrap: wrap; align-items: center; gap: 0; min-height: 28px;
    background: #161b22; border: 1px solid var(--edge); border-radius: 6px; padding: 4px 8px;
  }
  .tray img { width: 18px; height: 18px; margin-right: -4px; }
  .tray .adv { color: var(--success); font-size: 12px; font-weight: 700; margin-left: 8px; }
  .tray .lbl { color: var(--dim); font-size: 11px; width: 100%; margin-bottom: 2px; }

  /* ---- Overlays ---- */
  .overlay {
    position: absolute; inset: 0; background: rgba(13, 17, 23, 0.75); display: none;
    align-items: center; justify-content: center; z-index: 20; backdrop-filter: blur(4px);
    border-radius: 10px;
  }
  .card {
    background: var(--panel); border: 1.5px solid var(--accent); border-radius: 16px;
    padding: 32px 36px; text-align: center; box-shadow: 0 16px 48px rgba(0, 0, 0, 0.7);
    max-width: 380px; width: 90%;
  }
  .card h2 { font-size: 32px; margin-bottom: 6px; color: #fff; }
  .card p { color: var(--dim); margin-bottom: 24px; font-size: 15px; }
  .card .row { justify-content: center; gap: 8px; }
  .card button { min-width: 90px; padding: 10px 14px; font-size: 14px; }

  #promo { display: none; position: absolute; z-index: 30; flex-direction: column; gap: 4px; }
  #promo button {
    padding: 4px; background: #ffffff; border-radius: 8px; border: 2px solid var(--accent);
    cursor: pointer; box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
  }
  #promo img { width: 56px; height: 56px; display: block; }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 1000; }

  /* ---- Responsive ---- */
  @media (max-width: 1024px) {
    .app.visible { flex-direction: column; align-items: center; }
    #board { width: min(92vw, 560px); height: min(92vw, 560px); }
    .panel { width: min(92vw, 560px); }
    .bar { height: 180px; }
  }
</style>
</head>
<body>

<!-- ======== Landing Page ======== -->
<div id="landing">
  <div class="landing-card">
    <div class="landing-icon">&#9822;</div>
    <div class="landing-title">PyChess</div>
    <div class="landing-sub">Bitboard Engine &middot; Browser &amp; Desktop</div>

    <div class="landing-group">
      <span class="landing-label">Difficulty</span>
      <div class="landing-options" id="landingDiff">
        <button data-val="casual">Casual</button>
        <button data-val="club" class="active">Club</button>
        <button data-val="master">Master</button>
      </div>
    </div>

    <div class="landing-group">
      <span class="landing-label">Play as</span>
      <div class="landing-options" id="landingColor">
        <button data-val="1" class="active">White</button>
        <button data-val="-1">Black</button>
      </div>
    </div>

    <button id="btnPlay">Play Now</button>

    <div class="landing-features">
      <span class="landing-badge">⚡ 64-bit Bitboards</span>
      <span class="landing-badge">🧠 Alpha-Beta &amp; Quiescence</span>
      <span class="landing-badge">⏱ Zobrist Hashing</span>
      <span class="landing-badge">🔊 WebAudio SFX</span>
    </div>
  </div>
</div>

<!-- ======== Main Game App ======== -->
<div class="app" id="app">
  <div class="panel">
    <div class="panel-header">
      <h1>&#9822; PyChess</h1>
      <button id="btnHome" title="Return to Landing Page">🏠 Menu</button>
    </div>

    <div class="status" id="status">Loading…</div>

    <div class="bar">
      <div id="evalbar"><div id="evalfill" style="height:50%"></div><div id="evalmid"></div></div>
      <div id="moves"></div>
    </div>

    <div class="trays">
      <div class="tray" id="trayW"><span class="lbl">White captured</span></div>
      <div class="tray" id="trayB"><span class="lbl">Black captured</span></div>
    </div>

    <div class="controls">
      <select id="difficulty" title="Engine strength">
        <option value="casual">Casual</option>
        <option value="club" selected>Club</option>
        <option value="master">Master</option>
      </select>
      <select id="colour" title="Your side">
        <option value="1" selected>White</option>
        <option value="-1">Black</option>
      </select>

      <button class="primary span2" id="btnNew">New Game</button>
      <button id="btnUndo">↶ Undo</button>
      <button id="btnFlip">⇄ Flip</button>
      <button class="danger" id="btnResign">🏳 Resign</button>
      <button id="btnSound" title="Toggle sound">🔊 Sound</button>
      <button class="span2" id="btnPGN">📋 Copy PGN</button>
    </div>
  </div>

  <div class="boardwrap">
    <div id="board"></div>
    <div id="promo"></div>
    <div class="overlay" id="over">
      <div class="card">
        <h2 id="overTitle">Draw</h2>
        <p id="overSub">—</p>
        <div class="row">
          <button class="primary" id="btnRematch">Rematch</button>
          <button id="btnMenu">Close</button>
          <button id="btnOverLanding">Main Menu</button>
        </div>
      </div>
    </div>
  </div>
</div>

<canvas id="confetti"></canvas>

<script>
"use strict";
const IMG = c => "/img/" + (c > 0 ? "w_" : "b_") +
  ({1:"pawn",2:"knight",3:"bishop",4:"rook",5:"queen",6:"king"})[Math.abs(c)] + "_png_1024px.png";
const VAL = {1:1,2:3,3:3,4:5,5:9,6:0};
const TOKEN = Math.random().toString(36).slice(2);

let S = null;            // last state from server
let sel = null;          // selected square or null
let flipped = false;
let promoPending = null; // {from, to, promos:[]}
let soundEnabled = true; // sound toggle state

const boardEl = document.getElementById("board");
const statusEl = document.getElementById("status");
const movesEl = document.getElementById("moves");
const evalFill = document.getElementById("evalfill");
const overEl = document.getElementById("over");
const promoEl = document.getElementById("promo");
const appEl = document.getElementById("app");
const landingEl = document.getElementById("landing");

for (let i = 0; i < 64; i++) {
  const d = document.createElement("div");
  d.className = "sq";
  d.dataset.sq = i;
  boardEl.appendChild(d);
}
const squares = [...boardEl.children];

function viewOf(sq) {          // square -> [viewRow, viewCol]
  const r = sq >> 3, c = sq & 7;
  return flipped ? [7 - r, 7 - c] : [r, c];
}
function sqOf(viewR, viewC) {
  return flipped ? (7 - viewR) * 8 + (7 - viewC) : viewR * 8 + viewC;
}

function render() {
  if (!S) return;
  const legalFrom = {};
  if (S.legal) for (const [f, t, p] of S.legal) (legalFrom[f] ??= []).push([t, p]);
  const lastSet = new Set(S.last || []);

  squares.forEach(el => {
    const sq = parseInt(el.dataset.sq);
    const [vr, vc] = viewOf(sq);
    el.style.order = vr * 8 + vc;
    el.classList.toggle("light", (vr + vc) % 2 === 0);
    el.classList.toggle("dark", (vr + vc) % 2 !== 0);
    el.classList.toggle("last", lastSet.has(sq));
    el.classList.toggle("check", S.check === sq);
    el.classList.toggle("sel", sel === sq);
    el.innerHTML = "";
    const code = S.pieces[sq];
    if (code) {
      const pc = document.createElement("div");
      pc.className = "pc";
      pc.style.backgroundImage = `url('${IMG(code)}')`;
      el.appendChild(pc);
    }
    if (sel !== null && legalFrom[sel]) {
      for (const [t] of legalFrom[sel]) {
        if (t === sq) {
          const dot = document.createElement("div");
          dot.className = (S.pieces[sq] !== 0) ? "ring" : "dot";
          el.appendChild(dot);
        }
      }
    }
  });

  // Eval bar (white from bottom)
  const cp = S.eval;
  const frac = cp >= 29000 || cp <= -29000 ? (cp > 0 ? 1 : 0)
    : 1 / (1 + Math.pow(10, -cp / 400));
  evalFill.style.height = (frac * 100).toFixed(1) + "%";

  // Move list
  movesEl.innerHTML = S.san.map((s, i) =>
    (i % 2 === 0 ? `<span class="num">${i / 2 + 1}.</span>` : "") +
    `<span>${s}</span>${i % 2 === 0 ? " " : "<br>"}`).join("");
  movesEl.scrollTop = movesEl.scrollHeight;

  // Captured trays
  const fill = (id, codes, opp) => {
    const el = document.getElementById(id);
    el.innerHTML = '<span class="lbl">' + (id === "trayW" ? "White took" : "Black took") + "</span>";
    let gained = 0, lost = 0;
    for (const c of codes) { gained += VAL[Math.abs(c)]; const im = new Image(); im.src = IMG(c); el.appendChild(im); }
    for (const c of S.captured[String(opp)]) lost += VAL[Math.abs(c)];
    if (gained > lost) { const a = document.createElement("span"); a.className = "adv"; a.textContent = "+" + (gained - lost); el.appendChild(a); }
  };
  fill("trayW", S.captured["1"], -1);
  fill("trayB", S.captured["-1"], 1);

  // Status & game outcome
  const names = {casual: "Casual", club: "Club", master: "Master"};
  let txt = `<b>${names[document.getElementById("difficulty").value]}</b> · `;
  if (S.result) txt = "Game over";
  else if (S.side === (S.player === 1 ? 0 : 1)) txt += "Your move";
  else txt += "Engine thinking…";
  if (S.engine) {
    const shown = S.player === 1 ? S.engine[0] : -S.engine[0];
    txt += ` · engine ${fmtScore(shown)} @ d${S.engine[1]}`;
  }
  statusEl.innerHTML = txt;

  if (S.result) {
    const w = S.result.winner;
    const reason = S.result.reason;
    document.getElementById("overTitle").textContent =
      reason === "resignation" ? "You Resigned" :
      w === null ? "Draw" : (w === (S.player === 1 ? 0 : 1) ? "You Win!" : "Engine Wins");
    document.getElementById("overSub").textContent =
      {checkmate: "Checkmate", stalemate: "Stalemate", fifty: "Fifty-move rule",
       repetition: "Threefold repetition", material: "Insufficient material",
       resignation: "Resignation"}[reason] || reason;
    overEl.style.display = "flex";
    if (reason === "resignation") sfx("lose");
    else if (w !== null && w === (S.player === 1 ? 0 : 1)) { confettiBurst(); sfx("win"); }
    else if (w === null) sfx("draw");
    else sfx("lose");
  } else {
    overEl.style.display = "none";
  }
}

function fmtScore(cp) {
  if (cp >= 29000) return "+M"; if (cp <= -29000) return "-M";
  return (cp >= 0 ? "+" : "") + (cp / 100).toFixed(2);
}

async function api(path, body) {
  const r = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: {"Content-Type": "application/json"},
    body: body ? JSON.stringify(body) : undefined,
  });
  return r.json();
}

async function newGame() {
  sel = null; promoPending = null;
  const colour = parseInt(document.getElementById("colour").value);
  flipped = colour === -1;
  S = await api("/api/new", {token: TOKEN, colour,
                             difficulty: document.getElementById("difficulty").value});
  render(); sfx("move");
}

function showLanding() {
  overEl.style.display = "none";
  appEl.classList.remove("visible");
  landingEl.classList.remove("hidden");
}

// ---- Landing Page Interactions ----
(function initLanding() {
  document.querySelectorAll(".landing-options").forEach(group => {
    group.querySelectorAll("button").forEach(btn => {
      btn.addEventListener("click", () => {
        group.querySelectorAll("button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
      });
    });
  });

  document.getElementById("btnPlay").addEventListener("click", () => {
    const diff = document.querySelector("#landingDiff .active").dataset.val;
    const color = document.querySelector("#landingColor .active").dataset.val;
    document.getElementById("difficulty").value = diff;
    document.getElementById("colour").value = color;

    landingEl.classList.add("hidden");
    appEl.classList.add("visible");
    newGame();
  });
})();

// ---- Board Input: Whole-Square Clicks + Drag & Drop ----
let drag = null; // {from, startX, startY, ghost, moved}

function squareFromPoint(cx, cy) {
  const r = boardEl.getBoundingClientRect();
  const x = cx - r.left, y = cy - r.top;
  if (x < 0 || y < 0 || x >= r.width || y >= r.height) return null;
  const vc = Math.min(7, Math.floor(x / (r.width / 8)));
  const vr = Math.min(7, Math.floor(y / (r.height / 8)));
  return sqOf(vr, vc);
}

function attemptMove(from, to) {
  const options = S.legal.filter(([f, t]) => f === from && t === to);
  if (!options.length) return false;
  const promos = [...new Set(options.map(([, , p]) => p))].filter(p => p > 0);
  if (promos.length > 1) { showPromo(from, to, promos); return true; }
  sendMove(from, to, promos[0] || 0);
  return true;
}

boardEl.addEventListener("pointerdown", e => {
  if (e.button !== 0 || !S || S.result || !S.legal) return;
  const sq = squareFromPoint(e.clientX, e.clientY);
  if (sq === null) return;
  e.preventDefault();

  if (sel !== null && attemptMove(sel, sq)) return;

  const code = S.pieces[sq];
  if (code * S.player > 0 && S.legal.some(([f]) => f === sq)) {
    sel = (sel === sq) ? null : sq;
    if (sel !== null) {
      sfx("select");
      drag = { from: sq, startX: e.clientX, startY: e.clientY, ghost: null, moved: false };
      document.body.classList.add("dragging");
    }
    render();
  } else if (sel !== null) {
    sel = null;
    sfx("illegal");
    render();
  }
});

window.addEventListener("pointermove", e => {
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.startX, e.clientY - drag.startY) < 6) return;
  if (!drag.ghost) {
    const size = boardEl.getBoundingClientRect().width / 8;
    const g = document.createElement("div");
    g.className = "drag-ghost";
    g.style.width = g.style.height = size + "px";
    g.style.backgroundImage = `url('${IMG(S.pieces[drag.from])}')`;
    document.body.appendChild(g);
    drag.ghost = g;
    const src = squares.find(el => parseInt(el.dataset.sq) === drag.from);
    if (src) src.classList.add("drag-src");
  }
  drag.moved = true;
  const size = boardEl.getBoundingClientRect().width / 8;
  drag.ghost.style.left = (e.clientX - size / 2) + "px";
  drag.ghost.style.top = (e.clientY - size / 2) + "px";
});

window.addEventListener("pointerup", e => {
  document.body.classList.remove("dragging");
  if (!drag) return;
  const d = drag;
  drag = null;
  if (d.ghost) d.ghost.remove();
  document.querySelectorAll(".drag-src").forEach(el => el.classList.remove("drag-src"));
  if (!d.moved) return;
  const sq = squareFromPoint(e.clientX, e.clientY);
  if (sq !== null && sq !== d.from) attemptMove(d.from, sq);
});

function showPromo(from, to, promos) {
  promoPending = {from, to, promos};
  promoEl.innerHTML = "";
  const [vr, vc] = viewOf(to);
  const col = S.player === 1 ? "w_" : "b_";
  for (const p of [5, 4, 3, 2].filter(p => promos.includes(p))) {
    const b = document.createElement("button");
    const im = new Image(); im.src = `/img/${col}${({2:"knight",3:"bishop",4:"rook",5:"queen"})[p]}_png_1024px.png`;
    b.appendChild(im);
    b.onclick = () => { const pr = p; promoEl.style.display = "none"; sendMove(promoPending.from, promoPending.to, pr); };
    promoEl.appendChild(b);
  }
  promoEl.style.left = (vc * 80 + 14) + "px";
  promoEl.style.top = (vr <= 3 ? vr * 80 + 10 : vr * 80 - 4 * 60 + 10) + "px";
  promoEl.style.display = "flex";
}

async function sendMove(from, to, promo) {
  sel = null; promoEl.style.display = "none";
  statusEl.innerHTML = "Engine thinking…";
  const res = await api("/api/move", {token: TOKEN, from, to, promo});
  if (!res.ok) { sfx("illegal"); }
  S = res.state;
  const capNow = S.captured["1"].length + S.captured["-1"].length;
  sfx(capNow > (S._caps ?? 0) ? "capture" : "move");
  S._caps = capNow;
  if (S.check !== null && !S.result) sfx("check");
  render();
}

// ---- All Buttons Functional ----
document.getElementById("btnNew").onclick = newGame;
document.getElementById("btnRematch").onclick = newGame;
document.getElementById("btnMenu").onclick = () => overEl.style.display = "none";
document.getElementById("btnHome").onclick = showLanding;
document.getElementById("btnOverLanding").onclick = showLanding;

document.getElementById("btnUndo").onclick = async () => {
  const res = await api("/api/undo", {token: TOKEN});
  S = res.state; sel = null; render();
};

document.getElementById("btnFlip").onclick = () => { flipped = !flipped; render(); };

document.getElementById("btnResign").onclick = async () => {
  if (!S || S.result) return;
  if (!confirm("Are you sure you want to resign?")) return;
  const res = await api("/api/resign", {token: TOKEN});
  S = res.state; sel = null; render();
};

const btnSound = document.getElementById("btnSound");
btnSound.onclick = () => {
  soundEnabled = !soundEnabled;
  btnSound.textContent = soundEnabled ? "🔊 Sound" : "🔇 Muted";
};

document.getElementById("btnPGN").onclick = () => {
  if (!S || !S.san.length) return;
  let pgn = "";
  S.san.forEach((s, i) => {
    if (i % 2 === 0) pgn += (i / 2 + 1) + ". ";
    pgn += s + " ";
  });
  if (S.result) {
    const w = S.result.winner;
    if (S.result.reason === "resignation") pgn += (S.player === 1 ? "0-1" : "1-0");
    else if (w === null) pgn += "1/2-1/2";
    else pgn += (w === 0 ? "1-0" : "0-1");
  }
  pgn = pgn.trim();
  navigator.clipboard.writeText(pgn).then(() => {
    const btn = document.getElementById("btnPGN");
    const orig = btn.textContent;
    btn.textContent = "✓ Copied!";
    setTimeout(() => btn.textContent = orig, 1500);
  });
};

// ---- Tiny WebAudio SFX ----
let AC = null;
function sfx(kind) {
  if (!soundEnabled) return;
  try {
    AC ??= new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.connect(g); g.connect(AC.destination);
    const beep = (f0, f1, dur, vol, type) => {
      o.type = type || "sine"; o.frequency.setValueAtTime(f0, t);
      if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.start(t); o.stop(t + dur);
    };
    if (kind === "move") beep(190, 120, .09, .25, "triangle");
    else if (kind === "capture") beep(120, 60, .16, .35, "square");
    else if (kind === "select") beep(600, 800, .05, .12, "sine");
    else if (kind === "illegal") beep(150, 90, .12, .2, "sawtooth");
    else if (kind === "check") { beep(880, 880, .09, .18); setTimeout(() => sfx("select"), 90); }
    else if (kind === "win") [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => { AC && beep(f, f, .18, .2); }, i * 110));
    else if (kind === "lose") [784, 622, 523, 415].forEach((f, i) => setTimeout(() => { AC && beep(f, f, .2, .18); }, i * 130));
    else if (kind === "draw") [440, 440, 392].forEach((f, i) => setTimeout(() => { AC && beep(f, f, .18, .15); }, i * 140));
  } catch (e) { /* audio unavailable */ }
}

// ---- Confetti ----
const cvs = document.getElementById("confetti"), ctx = cvs.getContext("2d");
function confettiBurst() {
  cvs.width = innerWidth; cvs.height = innerHeight;
  const cols = ["#f0546e", "#ffc345", "#56cc89", "#58a6ff", "#bc8cff", "#fff0c8"];
  const parts = Array.from({length: 160}, () => ({
    x: Math.random() * cvs.width, y: -Math.random() * cvs.height * .5,
    vx: (Math.random() - .5) * 80, vy: 80 + Math.random() * 160,
    s: 4 + Math.random() * 5, a: Math.random() * 6.28, spin: (Math.random() - .5) * 8,
    c: cols[Math.random() * cols.length | 0],
  }));
  const t0 = performance.now();
  (function frame(t) {
    const dt = .016;
    ctx.clearRect(0, 0, cvs.width, cvs.height);
    for (const p of parts) {
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 60 * dt; p.a += p.spin * dt;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a);
      ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * .66); ctx.restore();
    }
    if (t - t0 < 6000 && parts.some(p => p.y < cvs.height + 20)) requestAnimationFrame(frame);
    else ctx.clearRect(0, 0, cvs.width, cvs.height);
  })(t0);
}
